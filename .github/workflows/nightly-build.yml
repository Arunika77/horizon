name: exact SDK candidate proof
run-name: SDK-only dry run for d09a4926a7
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run a non-publishing candidate check
        type: boolean
        required: true
        default: true
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: sdk-proof-d09a4926a7
  cancel-in-progress: false
jobs:
  build:
    if: inputs.dry_run && github.ref == 'refs/heads/sdk-proof-d09a492'
    uses: ./.github/workflows/prebuilt-game-build.yml
    with:
      commit: d09a4926a74451762c9e8b370ecfd82607501c6b
      dry_run: true
  verify-signature:
    needs: build
    uses: ./.github/workflows/sdk-publish.yml
    with:
      commit: d09a4926a74451762c9e8b370ecfd82607501c6b
      publish: false
